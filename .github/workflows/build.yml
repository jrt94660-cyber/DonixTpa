name: Build DonixTpa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn -B -U clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonixTpa-1.0.6
          path: target/DonixTpa-1.0.6.jar
          if-no-files-found: error
