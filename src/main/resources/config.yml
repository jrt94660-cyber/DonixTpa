# DonixTpa 1.0.2
# Paper 1.21.11 - 26.3
#
# Requests are private to the two players involved. A request expires automatically
# and is removed when either player disconnects.

settings:
  request-expire-seconds: 60
  request-cooldown-seconds: 10
  teleport-delay-seconds: 5
  cancel-on-move: true
  cancel-on-damage: true
  use-gui-by-default: true
  bedrock-name-prefix: "."
  max-outgoing-requests: 3
  max-incoming-requests: 5

dialogs:
  player-list-title: "&8ᴛᴇʟᴇᴘᴏʀᴛ"
  player-list-description: "&7Select an online player."
  action-title: "&8ᴛᴇʟᴇᴘᴏʀᴛ ᴏᴘᴛɪᴏɴs"
  confirm-title: "&8ᴄᴏɴғɪʀᴍ ᴛᴇʟᴇᴘᴏʀᴛ"
  player-button-width: 120
  action-button-width: 104
  confirm-button-width: 92

gui:
  confirm-title: "&8ᴄᴏɴғɪʀᴍ ᴛᴇʟᴇᴘᴏʀᴛ"
  accept-title: "&8ᴀᴄᴄᴇᴘᴛ ʀᴇǫᴜᴇsᴛ"
  list-title: "&8ɪɴᴄᴏᴍɪɴɢ ʀᴇǫᴜᴇsᴛs"
  size: 27
  list-size: 54
  filler-enabled: true
  filler-material: "GRAY_STAINED_GLASS_PANE"
  cancel-slot: 10
  player-slot: 12
  request-type-slot: 13
  dimension-slot: 14
  confirm-slot: 16
  close-slot: 49
  filler-name: " "

items:
  cancel-name: "&c&lCANCEL"
  cancel-lore:
    - "&7Click to go back."
  confirm-name: "&a&lCONFIRM"
  confirm-lore:
    - "&7Click to continue."
  accept-name: "&a&lACCEPT REQUEST"
  accept-lore:
    - "&7Click to accept this teleport."
  deny-name: "&c&lDENY REQUEST"
  deny-lore:
    - "&7Click to deny this teleport."
  close-name: "&c&lCLOSE"
  close-lore:
    - "&7Close this menu."
  type-tpa-name: "&b&lTELEPORT TO PLAYER"
  type-here-name: "&e&lTELEPORT HERE"
  dimension-overworld: "&aOverworld"
  dimension-nether: "&cNether"
  dimension-end: "&dThe End"
  request-entry-name: "&b%player%"
  request-entry-lore:
    - "&7Request type: &f%type%"
    - "&7Expires in: &f%time%s"
    - ""
    - "&aClick to view request."

sounds:
  enabled: true
  gui-click: "UI_BUTTON_CLICK"
  request-sent: "ENTITY_EXPERIENCE_ORB_PICKUP"
  request-received: "BLOCK_NOTE_BLOCK_PLING"
  request-accepted: "ENTITY_PLAYER_LEVELUP"
  request-denied: "ENTITY_VILLAGER_NO"
  countdown-tick: "BLOCK_NOTE_BLOCK_HAT"
  teleport-success: "ENTITY_ENDERMAN_TELEPORT"
  teleport-cancelled: "ENTITY_VILLAGER_NO"

